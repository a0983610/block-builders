appId: com.winton.blockbuilders
productName: BlockBuilders

directories:
  output: dist
  buildResources: build

# 只打包執行時真的用得到的：主行程、橋樑、還有整包網頁。
# 參考/（原始碼備份、參考圖、README、tools 開發腳本）不進 exe。
files:
  - package.json
  - src/main/**
  - src/preload/**
  - src/renderer/**

# Chromium 介面語系只留中文與英文（en-US 是備援）。全部 55 種有 48MB，留兩種只剩 1.1MB，
# portable 每次啟動要解壓的量跟著變小。
electronLanguages:
  - zh-TW
  - en-US

win:
  target:
    - portable
  # icon: build/icon.ico    # 還沒有圖示，先用 Electron 預設的；做好 256x256 的 .ico 放這裡再打開

portable:
  artifactName: BlockBuilders-${version}-portable.${ext}
  # 預設是先把 7z 解到暫存的中間資料夾、再複製一份去執行，暫存要吃約 840MB；
  # 開了之後直接解到執行的位置，實測暫存降到約 324MB、啟動從 6～16 秒變 4～5 秒。
  # 代價是 exe 從 96MB 變 140MB（不走 7z，改用 NSIS 自己的壓縮）。
  useZip: true
