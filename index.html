<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>積木小人 · 世界地標工地</title>
<style>
  :root{
    --ink:#1b2430; --panel:rgba(255,255,255,.86); --line:rgba(27,36,48,.14);
    --accent:#e8873c; --ok:#3f9e63; --bad:#c0483c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink); -webkit-user-select:none; user-select:none;
    background:linear-gradient(#5f9fd4 0%,#8fc0e4 46%,#cfe3ec 72%,#e6eee6 100%);
    -webkit-tap-highlight-color:transparent;
  }
  /* canvas 是 replaced element：絕對定位下 width:auto 會拿內建尺寸，
     所以寬高一定要明講（three 也會再設一次 style，兩邊一致） */
  #cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

  .card{
    position:fixed;background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 24px rgba(20,32,48,.16);
  }

  /* 左上：目前在蓋什麼 */
  #head{top:14px;left:14px;padding:10px 14px;min-width:206px}
  #head h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.5px}
  #head .sub{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;opacity:.75}
  .tag{padding:1px 8px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
  .tag.ok{background:var(--ok)}
  .tag.bad{background:var(--bad)}
  #stat{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11px;opacity:.72;
        font-variant-numeric:tabular-nums}
  #stat b{font-weight:700;opacity:.95}
  #track{height:5px;border-radius:99px;background:rgba(27,36,48,.13);margin-top:8px;overflow:hidden}
  #bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f0b46b);transition:width .25s}

  /* 右上：時鐘與計時 */
  #time{top:14px;right:14px;padding:10px 14px;text-align:right}
  #clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  #time .row{margin-top:3px;font-size:12px;opacity:.72;font-variant-numeric:tabular-nums}
  #time .row.bad b{color:var(--bad)}          /* 損失用紅字，跟施工計時一眼分得開 */

  /* 左下：設定 */
  /* 面板往上讓出一排，收合鈕才不會壓在面板上 */
  #panel{left:14px;bottom:58px;padding:12px 14px;width:262px;transition:transform .22s,opacity .22s}
  #panel.hide{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
  #panel .r{display:flex;align-items:center;gap:8px;margin:9px 0}
  #panel label{flex:0 0 54px;font-size:12px;opacity:.78}
  #panel .v{flex:0 0 46px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;opacity:.9}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  select,button{
    font:inherit;font-size:13px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;
  }
  select{width:100%}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700;width:100%}
  /* 兩顆按鈕併排：flex:1 的 flex-basis 是 0，所以 .primary 身上的 width:100% 不會搶寬度 */
  #panel .btns{display:flex;gap:7px}
  #panel .btns button{flex:1;white-space:nowrap;padding:6px 4px}
  #panel .btns button:disabled{opacity:.42;cursor:default}
  .checks{display:flex;gap:14px;margin-top:10px;font-size:12px;opacity:.8}
  .checks label{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  #panelBtn{position:fixed;left:14px;bottom:14px;z-index:5;padding:7px 11px}

  #ver{
    position:fixed;right:14px;bottom:14px;z-index:4;
    font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);opacity:.42;
    pointer-events:none;
  }
  #hint{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    padding:7px 15px;border-radius:99px;background:rgba(27,36,48,.55);color:#fff;
    font-size:12px;white-space:nowrap;pointer-events:none;
  }

  /* 破壞工具列（畫面上方中央） */
  #tools{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:7px;z-index:6}
  .tool{
    display:flex;flex-direction:column;align-items:center;gap:1px;
    min-width:62px;padding:6px 10px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(20,32,48,.16);cursor:pointer;
  }
  .tool .k{font-size:19px;line-height:1.1}
  .tool .n{font-size:11px;opacity:.8}
  .tool.on{background:var(--accent);color:#fff;border-color:transparent}
  .tool.on .n{opacity:.95}
  .tool.lock{opacity:.5;filter:grayscale(1)}
  /* 大槌跟槌子同一個圖示，靠尺寸區分 */
  .tool[data-tool="bighammer"] .k{font-size:25px}

  /* 成就與提示（工具列移到上方後，提示往下讓開） */
  #toast{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:15;
         display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  #toast .t{
    padding:8px 16px;border-radius:12px;background:rgba(27,36,48,.88);color:#fff;
    display:flex;flex-direction:column;align-items:center;line-height:1.35;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  #toast .t b{font-size:14px}
  #toast .t span{font-size:11px;opacity:.72}

  #badgeWrap{position:fixed;inset:0;z-index:22;display:none;place-items:center;
             background:rgba(12,18,26,.72)}
  #badgeWrap.on{display:grid}
  #badgeBox{background:#fff;border-radius:16px;padding:18px 20px;width:min(520px,92vw);
            max-height:82vh;overflow:auto}
  #badgeBox h2{margin:0 0 2px;font-size:17px}
  #badgeBox .sub{font-size:12px;opacity:.65;margin-bottom:3px}
  /* 成就多了就排兩欄，不然要一直捲 */
  #badgeBox #badges{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #badgeLoss{color:var(--bad);font-weight:700}
  .badge{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;
         background:#f2f2f0;opacity:.55}
  .badge.got{background:#fdf1e2;opacity:1}
  .badge b{font-size:13px}
  .badge span{font-size:11.5px;opacity:.7}
  #badgeBox .row{display:flex;gap:8px;margin-top:12px}
  #badgeBox .row button{flex:1}

  /* 十種道具排成一排要 691px，左上的建築資訊卡玩久了會撐到 354px
     （累計金額變七位數那一刻），右緣就落在 368。工具列置中，
     左緣是 (視窗 − 691) / 2，要閃過 368 得有 1427 以上。
     所以不到 1430 就整排搬到畫面底部、只留圖示：
     版面本來就空著的下緣拿來放它，比擠在上面兩張卡中間好。 */
  @media (max-width:1430px){
    #tools{top:auto;bottom:12px;gap:4px;flex-wrap:wrap;justify-content:center;
           max-width:calc(100vw - 190px)}
    .tool{min-width:32px;padding:4px 3px}
    .tool .k{font-size:17px}
    .tool .n{display:none}
    /* 底部這一排的左右兩角讓給版本號與設定鈕，中間才留給工具列 */
    #panelBtn{right:14px;left:auto}
    #ver{left:14px;right:auto}
    /* 手機寬度下工具列會折成兩排，設定面板要跟著往上讓，不然會壓在工具上 */
    #panel{bottom:84px}
  }

  @media (max-width:640px){
    /* 限寬，不然統計那一行會把卡片撐到右上角的時鐘底下 */
    #head{min-width:0;padding:8px 11px;max-width:calc(100vw - 220px)}
    #head h1{font-size:15px}
    #stat{font-size:10px;gap:2px 8px}
    #clock{font-size:20px}
    #panel{width:calc(100vw - 28px)}
    #hint{display:none}
    #toast{top:14px}
    #badgeBox #badges{grid-template-columns:1fr}   /* 手機排不下兩欄 */
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="card" id="head">
  <h1 id="bname">—</h1>
  <div class="sub"><span class="tag" id="phase">施工中</span><span id="prog">0 / 0</span><span id="bcount"></span></div>
  <div id="track"><div id="bar"></div></div>
  <div id="stat">
    <span>本次人力 <b id="cost">$0</b></span>
    <span>累計 <b id="costAll">$0</b></span>
    <span>拆掉 <b id="nDest">0</b> 座</span>
    <span>擊飛 <b id="nSmash">0</b> 塊</span>
  </div>
</div>

<div class="card" id="time">
  <div id="clock">--:--:--</div>
  <div class="row">施工 <b id="timer">0:00</b></div>
  <div class="row bad">損失 <b id="lossAll">$0</b></div>
  <div class="row" id="fps">— fps</div>
  <button id="badgeBtn" style="margin-top:7px;width:100%">🏅 成就</button>
</div>

<div id="toast"></div>
<div id="tools"></div>

<button id="panelBtn">⚙ 設定</button>
<div class="card" id="panel">
  <select id="shape"></select>
  <div class="r"><label>建材</label><input id="cnt" type="range" min="300" max="3000" step="50" value="3000"><span class="v" id="vCnt">3000</span></div>
  <div class="r"><label>小人</label><input id="wk" type="range" min="1" max="60" step="1" value="20"><span class="v" id="vWk">20</span></div>
  <div class="r"><label>速度</label><input id="spd" type="range" min="0.2" max="4" step="0.1" value="1"><span class="v" id="vSpd">1.0×</span></div>
  <div class="btns">
    <button class="primary" id="again">換一座來蓋</button>
    <button id="finish" title="跳過施工過程，直接把這一座蓋好（不算人力費）">⚡ 立刻建成</button>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="spin"> 自轉</label>
    <label><input type="checkbox" id="mute"> 靜音</label>
  </div>
</div>

<div id="hint">點建築 = 一槌砸下去 ｜ 拖曳轉視角 ｜ WASD 平移 ｜ 滾輪縮放 ｜ 點小人會跌倒</div>
<div id="ver"></div>

<div id="badgeWrap">
  <div id="badgeBox">
    <h2>成就</h2>
    <div class="sub">已解鎖 <span id="badgeN">0 / 0</span>　·　累計造成損失 <b id="badgeLoss">$0</b>
      （拆掉 <span id="badgeDest">0</span> 座、擊飛 <span id="badgeSmash">0</span> 塊）</div>
    <div class="sub">紀錄會自動存在這台電腦上</div>
    <div id="badges"></div>
    <div class="row">
      <button id="resetBtn">清空紀錄</button>
      <button class="primary" id="badgeClose">關閉</button>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="src/blueprints.js"></script>
<script src="src/engine.js"></script>
<script src="src/game.js"></script>
<script>boot();</script>
</body>
</html>
