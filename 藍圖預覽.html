<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藍圖預覽 · 積木小人</title>
<!--
  藍圖工作台：直接看一份藍圖蓋起來長什麼樣，並跑體檢產出可貼回給 AI 的報告。
  為什麼獨立一頁而不是放在遊戲裡：這件事是「做藍圖」而不是「玩」——
  不需要小人、不需要施工、不需要破壞道具，也不該在遊戲的設定面板裡佔一格。
  改了 blueprints/ 裡的檔案按 F5 就好。
-->
<style>
  :root{--ink:#2b2b2b;--card:rgba(255,255,255,.94);--line:#dcd7cc;--acc:#e8833a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
  body{background:linear-gradient(#bcd3e0,#e7eef2)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #side{position:fixed;left:14px;top:14px;bottom:14px;width:388px;z-index:3;
    display:flex;flex-direction:column;gap:9px;
    background:var(--card);border-radius:16px;padding:14px 16px;
    box-shadow:0 8px 26px rgba(20,30,40,.18);backdrop-filter:blur(3px)}
  h1{margin:0;font-size:17px}
  .sub{font-size:12px;opacity:.62;margin-top:-4px}
  .r{display:flex;align-items:center;gap:8px}
  .r label{flex:0 0 44px;font-size:12px;opacity:.78}
  .r .v{flex:0 0 50px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  select,input[type=range]{flex:1;min-width:0}
  select{padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}
  .btns{display:flex;gap:7px}
  button{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font:inherit;cursor:pointer}
  button:hover{background:#f4efe7}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  #stat{font-size:12px;line-height:1.7;font-variant-numeric:tabular-nums;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 0}
  #stat b{font-weight:700}
  #rep{flex:1;min-height:120px;width:100%;resize:none;
    font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre;
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
  #pasteBox{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}
  #pasteBox summary{cursor:pointer;font-size:12.5px;font-weight:700}
  #paste{width:100%;height:92px;margin:7px 0;resize:vertical;
    font:11.5px/1.45 ui-monospace,Consolas,monospace;
    border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  #pasteMsg{font-size:11.5px;margin-top:6px;display:none}
  #pasteMsg.on{display:block}
  #pasteMsg.bad{color:#c0483c}
  #pasteMsg.good{color:#3f7a34}
  .hint{font-size:11.5px;opacity:.6}
  .checks{display:flex;gap:12px;font-size:12px;opacity:.85}
  #err{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:24px;
    background:#f4efe7;font-size:15px;line-height:1.8}
  #err.on{display:grid}
  @media (max-width:760px){
    #side{left:8px;right:8px;top:8px;bottom:auto;width:auto;max-height:64vh}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="side">
  <h1>藍圖預覽</h1>
  <div class="sub">看藍圖蓋起來的樣子，並產出貼得回去給 AI 的體檢報告</div>
  <div class="r"><label>藍圖</label><select id="shape"></select></div>
  <div class="r"><label>建材</label>
    <input id="cnt" type="range" min="300" max="10000" step="100" value="3000">
    <span class="v" id="vCnt">3000</span></div>
  <div class="btns">
    <button class="primary" id="go">重新產生</button>
    <button id="chk">🔍 檢查藍圖</button>
  </div>
  <div class="checks">
    <!-- 自轉預設關：要對照參考圖的時候，畫面一直在轉反而不好比 -->
    <label><input type="checkbox" id="spin"> 自轉</label>
    <label><input type="checkbox" id="wire"> 只看輪廓（隱藏草地）</label>
  </div>
  <!-- 預設展開：AI 產的藍圖多半是「貼上」而不是「存檔」進來的，這是主要入口 -->
  <details id="pasteBox" open>
    <summary>貼上藍圖（不用先存檔）</summary>
    <textarea id="paste" spellcheck="false"
      placeholder="把 AI 給的整段貼進來（就是 blueprints/ 裡那種 customBlueprint({...}) 的內容），按下面的按鈕就直接預覽並診斷。```js 圍籬與「檔名：xxx.js」那行會自動忽略。"></textarea>
    <div class="btns"><button id="load">貼上並預覽</button></div>
  </details>
  <div id="pasteMsg"></div>
  <div id="stat"></div>
  <textarea id="rep" readonly spellcheck="false" placeholder="按「🔍 檢查藍圖」產出報告，整段複製貼回給產出這份藍圖的 AI。"></textarea>
  <div class="btns"><button id="copy">複製報告</button></div>
  <div class="hint">拖曳轉視角　·　滾輪縮放　·　貼上的藍圖只活在這一頁（要留著就存進 <code>blueprints/</code> 並加進 <code>list.js</code>）</div>
</div>

<div id="err"></div>

<script src="lib/three.min.js"></script>
<script src="src/blueprints.js"></script>
<!-- 自訂藍圖：跟 index.html 同一套（list.js 列檔名 → 逐一載入 → 檔案自己呼叫 customBlueprint） -->
<script src="blueprints/list.js"></script>
<script>
  if (window.BP_FILES) for (var i = 0; i < BP_FILES.length; i++)
    document.write('<script src="blueprints/' + encodeURI(BP_FILES[i]) + '"><\/script>');
</script>
<script src="src/engine.js"></script>
<script>
/* 版本號：報告的抬頭要帶版本，AI 才知道手上的說明文件對不對得上。
   這一頁不載 game.js（那會把整個遊戲跑起來），所以自己留一份，
   e2e 有一條測試守著它跟 src/game.js 的 VERSION 一致。 */
const VIEWER_VER = '1.44.1';

const $ = id => document.getElementById(id);

/* 相依檔沒放齊時給一句人看得懂的話，而不是一片空白（跟 index.html 同一個用意） */
(function guard() {
  const miss = [];
  if (typeof THREE === 'undefined') miss.push('lib/three.min.js');
  if (typeof SHAPES === 'undefined') miss.push('src/blueprints.js');
  if (typeof ENG === 'undefined') miss.push('src/engine.js');
  if (!miss.length) return;
  $('err').innerHTML = '🧱 <b>檔案沒放齊，這一頁跑不起來</b><br>' +
    '缺：' + miss.join('、') + '<br>請把整包解壓縮出來之後，再開資料夾裡的這一頁。';
  $('err').classList.add('on');
  throw new Error('missing deps: ' + miss.join(','));
})();

/* ── 場景：這一頁只畫積木 ────────────────────────────────
   引擎的每個 InstancedMesh 預設 count 就是它的上限，沒餵資料的話
   會在原點冒出 80 個小人、一堆石頭與樹。所以全部餵一次空的。 */
ENG.init($('cv'));
ENG.resize();
ENG.setWorkerCount(0);
ENG.putTrees([]); ENG.putDust([]); ENG.putRocks([]); ENG.putTrebs([]);
ENG.putDozers([]); ENG.putBombs([]); ENG.putMeteors([]); ENG.putTornados([]);
ENG.putFire([]); ENG.putFlash([]);
ENG.hideBall(); ENG.hideHammer(); ENG.hideNuke(); ENG.hideRings();
window.addEventListener('resize', () => ENG.resize());

/* ── 選單：自訂藍圖排前面（自己丟檔案進來的人就是想馬上看到它） ──
   sort 在現代 JS 是穩定的，所以內建那 48 座之間的先後不會被打亂。 */
function refreshMenu(pick) {
  const order = SHAPES.map((s, i) => i)
    .sort((a, b) => (SHAPES[b].custom ? 1 : 0) - (SHAPES[a].custom ? 1 : 0));
  $('shape').innerHTML = order.map(i =>
    '<option value="' + i + '">' + (SHAPES[i].custom ? '★ ' : '') + SHAPES[i].n + '</option>').join('');
  if (pick !== undefined) $('shape').value = String(pick);
}
refreshMenu();

/* ── 產生一份藍圖並擺上場 ───────────────────────────────── */
const HB = ENG.BS / 2;
const ZERO = new THREE.Euler();
let bp = null;

function build() {
  const idx = +$('shape').value, want = +$('cnt').value;
  const t0 = performance.now();
  try {
    bp = makeBlueprint(idx, want);
  } catch (e) {
    bp = null;
    $('stat').innerHTML = '<b style="color:#c0483c">產不出來</b>：' + (e && e.message ? e.message : e) +
                          '<br>按「🔍 檢查藍圖」看完整診斷。';
    ENG.setBlockCount(0); ENG.commitBlocks();
    return;
  }
  const ms = Math.round(performance.now() - t0);

  let w = 0, d = 0;
  for (const s of bp.slots) { w = Math.max(w, Math.abs(s.x)); d = Math.max(d, Math.abs(s.z)); }
  ENG.setBlockCount(bp.slots.length);
  for (let i = 0; i < bp.slots.length && i < ENG.MAXB; i++) {
    const s = bp.slots[i], c = bp.pal[s.c % bp.pal.length];
    ENG.putBlock(i, s.x, s.y + HB, s.z, ZERO, 1,
                 ((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255);
  }
  ENG.commitBlocks();
  /* 取景。第三個參數在遊戲裡是碎料散落範圍，這一頁沒有碎料，但它同時決定
     草地大小（arena + 26）與起霧距離——給得太小的話會看到草地的邊緣與後面的天空。
     取景距離大約是建築半徑的兩倍多，所以草地至少要鋪到那麼遠。 */
  ENG.fitCamera(bp.radius, bp.height, Math.max(bp.radius * 2 + 30, bp.height * 1.6), true);

  const over = bp.slots.length > ENG.MAXB;
  $('stat').innerHTML =
    '<b>' + bp.name + '</b>　' + bp.slots.length.toLocaleString('en-US') + ' 塊' +
    '（想要 ' + want.toLocaleString('en-US') + '，差 ' +
    (bp.slots.length >= want ? '+' : '') + Math.round((bp.slots.length / want - 1) * 100) + '%）<br>' +
    '尺寸 ' + Math.round(w * 2 + 1) + '×' + bp.height + '×' + Math.round(d * 2 + 1) + ' 格' +
    '　·　配色 ' + bp.pal.length + ' 色' +
    '　·　產生 ' + ms + 'ms' +
    (over ? '<br><b style="color:#c0483c">超過積木池上限 ' + ENG.MAXB +
            '，多的沒畫出來</b>' : '');
}

/* ── 貼上藍圖 ─────────────────────────────────────────────
   做藍圖的節奏是「貼上 → 看 → 改 → 再貼」，中間不該卡著「存檔案 + 編輯 list.js」。
   所以這裡貼進來的藍圖**只活在這一頁**（F5 就沒了，要留著就照下面那行提示存檔）。
   這等於執行使用者自己貼進來的程式碼——跟把 .js 丟進 blueprints/ 同一個信任等級，
   而這一頁本來就是給做藍圖的人用的。遊戲（index.html）沒有這個入口。 */
const pasted = new Set();          // 這一頁貼進來的那幾份在 SHAPES 的索引

function cleanPaste(t) {
  return String(t)
    .replace(/```[a-zA-Z]*\n?/g, '')     // AI 很愛加的 markdown 圍籬
    .replace(/^\s*檔名[：:].*$/gm, '')    // 「檔名：我的塔.js」那一行
    .trim();
}

function pasteBlueprint(raw) {
  const code = cleanPaste(raw);
  if (!code) throw new Error('貼上的內容是空的。');
  if (code.indexOf('customBlueprint') < 0)
    throw new Error('看不到 customBlueprint(...)。要貼的是 blueprints/ 裡那種檔案的整段內容。');

  /* 先用一個攔截版的 customBlueprint 把定義接下來：這樣能先看名字，
     決定要不要蓋掉上一次貼的同名那份，再交給真正的 customBlueprint 走它的驗證。
     其他工具（dim／blob／tint…）都是全域，貼進來的程式直接看得到。 */
  const defs = [];
  let fn;
  try { fn = new Function('customBlueprint', code); }
  catch (e) { throw new Error('程式有語法錯誤：' + e.message); }
  try { fn(d => { defs.push(d); return 0; }); }
  catch (e) { throw new Error('執行時出錯：' + e.message); }
  if (!defs.length) throw new Error('這段程式沒有真的呼叫到 customBlueprint(...)。');

  const added = [];
  for (const def of defs) {
    if (!def || !def.name) throw new Error('customBlueprint 少了 name。');
    const old = SHAPES.findIndex(s => s.n === def.name);
    if (old >= 0) {
      if (!pasted.has(old))
        throw new Error('名字「' + def.name + '」跟內建或 blueprints/ 裡的藍圖撞號，改個 name 再貼。');
      /* 只蓋掉自己貼的那份。splice 會讓後面的索引往前挪一格，所以整組重算 */
      SHAPES.splice(old, 1);
      const moved = [];
      for (const i of pasted) if (i !== old) moved.push(i > old ? i - 1 : i);
      pasted.clear();
      for (const i of moved) pasted.add(i);
    }
    // customBlueprint 擋掉時的理由只走 console.warn，借過來當錯誤訊息
    let why = '';
    const orig = console.warn;
    console.warn = m => { why = String(m); };
    let idx;
    try { idx = customBlueprint(def); } finally { console.warn = orig; }
    if (idx < 0) throw new Error(why || '這份藍圖被 customBlueprint 擋掉了。');
    pasted.add(idx);
    added.push({ idx: idx, name: def.name });
  }
  return added;
}

/* ── 體檢報告 ───────────────────────────────────────────── */
function diagnose() {
  const r = checkBlueprint(+$('shape').value, { ver: VIEWER_VER });
  $('rep').value = r.text;
  return r;
}

/* 複製：file:// 給不給 clipboard API 看瀏覽器政策，所以留一條 execCommand 的退路。
   報告的整個價值就在「複製得出去」。 */
function copyReport() {
  const ta = $('rep');
  if (!ta.value) { ta.value = diagnose().text; }
  const done = () => { $('copy').textContent = '已複製 ✓';
                       setTimeout(() => { $('copy').textContent = '複製報告'; }, 1600); };
  const legacy = () => {
    try {
      ta.removeAttribute('readonly');
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      ta.setAttribute('readonly', '');
      if (ok) { done(); return; }
    } catch (e) { /* 兩條都不通 */ }
    $('copy').textContent = '請按 Ctrl+C';
    setTimeout(() => { $('copy').textContent = '複製報告'; }, 2200);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, legacy);
      return;
    }
  } catch (e) { /* 往下走舊路 */ }
  legacy();
}

/* ── 操作 ───────────────────────────────────────────────── */
$('shape').addEventListener('change', () => { build(); $('rep').value = ''; });
$('cnt').addEventListener('input', e => { $('vCnt').textContent = e.target.value; });
$('cnt').addEventListener('change', build);
$('go').addEventListener('click', build);
$('chk').addEventListener('click', diagnose);
/* 貼上 → 進清單 → 選起來 → 畫出來 → 順手把診斷也跑掉。
   貼的人要的就是這一連串，不該還要自己再按兩個按鈕。 */
$('load').addEventListener('click', () => {
  const msg = $('pasteMsg');
  try {
    const added = pasteBlueprint($('paste').value);
    const last = added[added.length - 1];
    refreshMenu(last.idx);
    build();
    diagnose();
    msg.className = 'on good';
    msg.textContent = '✔ 已載入「' + added.map(a => a.name).join('、') + '」' +
      (added.length > 1 ? '（' + added.length + ' 份，選的是最後一份）' : '') + '，下面是它的診斷。';
    // 成功就把貼上區收起來，把版面讓給報告（失敗時留著，那段文字還要改）
    $('pasteBox').open = false;
  } catch (e) {
    msg.className = 'on bad';
    msg.textContent = '✘ ' + ((e && e.message) ? e.message : e);
  }
});
$('copy').addEventListener('click', copyReport);
/* 「只看輪廓」＝把草地那三層藏起來。引擎沒有給那幾顆網格取名字，
   但上面已經把其他東西全餵空的了，所以「現在還看得見、又不是積木的網格」
   就是草皮／切邊／土層這三顆。開場記下來，之後只切它們。 */
const GROUND = ENG.three.scene.children.filter(
  o => o.isMesh && o !== ENG.three.blockMesh && o.visible);
$('wire').addEventListener('change', e => {
  for (const o of GROUND) o.visible = !e.target.checked;
});

let drag = null;
$('cv').addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', () => { drag = null; });
window.addEventListener('pointermove', e => {
  if (!drag) return;
  ENG.orbit(e.clientX - drag.x, e.clientY - drag.y);
  drag = { x: e.clientX, y: e.clientY };
});
$('cv').addEventListener('wheel', e => {
  ENG.zoom(e.deltaY > 0 ? 1.11 : 0.9); e.preventDefault();
}, { passive: false });

/* ── 主迴圈：只有鏡頭在動，積木擺一次就不用再算 ───────────── */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (last || now)) / 1000);
  last = now;
  if ($('spin').checked) ENG.cam.yaw += dt * 0.16;
  ENG.updateCamera(dt);
  ENG.render();
}

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
